<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสแกนคูปองร้านค้า - เซียนบางแสน</title>
  
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- Firebase App & Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTxOK9squ1wudbPLRvtj3j1w-Grk8Ous0",
      authDomain: "sainbangsan-v1.firebaseapp.com",
      projectId: "sainbangsan-v1",
      storageBucket: "sainbangsan-v1.firebasestorage.app",
      messagingSenderId: "162303527169",
      appId: "1:162303527169:web:27250f8c2532385acfb300"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isProcessing = false;

    // ฟังก์ชันตรวจสอบและตัดสิทธิ์คูปองเมื่อร้านค้าสแกนเจอ
    async function verifyAndRedeemCoupon(qrText) {
      if (isProcessing) return;
      isProcessing = true;

      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';
      resultBox.className = 'status-box loading';
      resultBox.innerHTML = '⏳ กำลังตรวจสอบรหัสคูปองกับฐานข้อมูล...';

      try {
        // ดึง Coupon ID จาก QR Code (รูปแบบ: CPN_timestamp_random)
        const couponRef = doc(db, "issued_coupons", qrText.trim());
        const couponSnap = await getDoc(couponRef);

        if (!couponSnap.exists()) {
          showResult('❌ ไม่พบข้อมูลคูปองนี้ในระบบ (รหัสไม่ถูกต้อง)', 'error');
          return;
        }

        const data = couponSnap.data();

        // 1. เช็กว่าใช้ไปแล้วหรือยัง
        if (data.isUsed) {
          showResult(`❌ คูปองนี้ถูกใช้งานไปแล้ว!<br><small>โดยผู้เล่น: ${data.playerName}</small>`, 'error');
          return;
        }

        // 2. เช็กว่าหมดอายุ 1 นาทีหรือยัง
        const now = new Date().getTime();
        const expireTime = data.expiresAt.toDate().getTime();

        if (now > expireTime) {
          showResult(`⏰ คูปองนี้หมดอายุแล้ว!<br><small>(เกินกำหนดเวลา 1 นาที)</small>`, 'error');
          return;
        }

        // 3. ผ่านทุกเงื่อนไข -> ทำการตัดสิทธิ์ทันที
        await updateDoc(couponRef, {
          isUsed: true,
          redeemedAt: new Date()
        });

        showResult(`✅ คูปองถูกต้อง!<br><b style="font-size:22px; color:#16a34a;">รับส่วนลดได้เลย 🎉</b><br><small>ผู้เล่น: ${data.playerName} (${data.storeName})</small>`, 'success');

      } catch (e) {
        console.error(e);
        showResult('❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล', 'error');
      } finally {
        setTimeout(() => { isProcessing = false; }, 3000);
      }
    }

    function showResult(msg, type) {
      const resultBox = document.getElementById('result-box');
      resultBox.className = `status-box ${type}`;
      resultBox.innerHTML = msg;
    }

    window.verifyAndRedeemCoupon = verifyAndRedeemCoupon;
  </script>

  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; margin-top: 0; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8; background: #000; }
    .status-box { margin-top: 20px; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; display: none; line-height: 1.5; }
    .status-box.loading { background: #fef3c7; color: #b45309; display: block; }
    .status-box.success { background: #dcfce7; color: #15803d; border: 2px solid #22c55e; display: block; }
    .status-box.error { background: #fee2e2; color: #b91c1c; border: 2px solid #ef4444; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏪 แอปสแกนคูปองร้านค้า</h2>
    <p style="font-size: 13px; color: #94a3b8;">สแกน QR Code บนมือถือลูกค้าเพื่อใช้สิทธิ์ส่วนลด</p>
    
    <!-- ช่องแสดงกล้องสแกน -->
    <div id="reader"></div>

    <!-- กล่องแสดงผลการสแกน -->
    <div id="result-box" class="status-box"></div>
  </div>

  <script>
    // เริ่มเปิดกล้องเมื่อโหลดหน้าเว็บ
    function onScanSuccess(decodedText, decodedResult) {
      if (typeof window.verifyAndRedeemCoupon === 'function') {
        window.verifyAndRedeemCoupon(decodedText);
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } }, /* verbose= */ false);
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
